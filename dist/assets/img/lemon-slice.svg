<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 外层柠檬黄环 -->
  <ellipse cx="100" cy="100" rx="95" ry="90" fill="#FFD93D" stroke="#E8A317" stroke-width="3"/>
  <!-- 内层浅黄果肉区 -->
  <ellipse cx="100" cy="100" rx="80" ry="75" fill="#FFE45E"/>
  <!-- 8 瓣分隔线(从中心到外缘) -->
  <g stroke="#E8A317" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="100" y1="100" x2="100" y2="20"/>
    <line x1="100" y1="100" x2="156" y2="44"/>
    <line x1="100" y1="100" x2="180" y2="100"/>
    <line x1="100" y1="100" x2="156" y2="156"/>
    <line x1="100" y1="100" x2="100" y2="180"/>
    <line x1="100" y1="100" x2="44" y2="156"/>
    <line x1="100" y1="100" x2="20" y2="100"/>
    <line x1="100" y1="100" x2="44" y2="44"/>
  </g>
  <!-- 中心白色髓心 -->
  <circle cx="100" cy="100" r="7" fill="#FFFFFF" stroke="#E8A317" stroke-width="1.5"/>
  <!-- 每瓣的果肉纹理线(短小倾斜) -->
  <g stroke="#E8A317" stroke-width="1.2" fill="none" opacity="0.55" stroke-linecap="round">
    <!-- 上瓣 -->
    <line x1="100" y1="50" x2="100" y2="38"/>
    <line x1="92" y1="55" x2="88" y2="42"/>
    <line x1="108" y1="55" x2="112" y2="42"/>
    <!-- 右上瓣 -->
    <line x1="130" y1="55" x2="135" y2="42"/>
    <line x1="138" y1="62" x2="146" y2="52"/>
    <line x1="120" y1="60" x2="125" y2="48"/>
    <!-- 右瓣 -->
    <line x1="155" y1="75" x2="167" y2="70"/>
    <line x1="160" y1="100" x2="172" y2="100"/>
    <line x1="155" y1="125" x2="167" y2="130"/>
    <!-- 右下瓣 -->
    <line x1="138" y1="138" x2="146" y2="148"/>
    <line x1="130" y1="145" x2="135" y2="158"/>
    <line x1="120" y1="140" x2="125" y2="152"/>
    <!-- 下瓣 -->
    <line x1="100" y1="150" x2="100" y2="162"/>
    <line x1="92" y1="145" x2="88" y2="158"/>
    <line x1="108" y1="145" x2="112" y2="158"/>
    <!-- 左下瓣 -->
    <line x1="70" y1="145" x2="65" y2="158"/>
    <line x1="62" y1="138" x2="54" y2="148"/>
    <line x1="80" y1="140" x2="75" y2="152"/>
    <!-- 左瓣 -->
    <line x1="45" y1="125" x2="33" y2="130"/>
    <line x1="40" y1="100" x2="28" y2="100"/>
    <line x1="45" y1="75" x2="33" y2="70"/>
    <!-- 左上瓣 -->
    <line x1="62" y1="62" x2="54" y2="52"/>
    <line x1="70" y1="55" x2="65" y2="42"/>
    <line x1="80" y1="60" x2="75" y2="48"/>
  </g>
</svg>
